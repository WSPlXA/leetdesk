name: Publish server image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish Linux amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Normalize and validate tag input
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$RELEASE_TAG" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Enter an existing tag such as v0.2.0.'
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out requested version
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version."
            exit 1
          fi

      - name: Set image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/leetdesk-server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=leetdesk-server
          cache-to: type=gha,mode=max,scope=leetdesk-server

      - name: Check container startup and authentication
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          docker run -d --name leetdesk-server-smoke \
            -e "LEETDESK_SERVER_TOKEN=$token" \
            -p 127.0.0.1:18787:8787 "$IMAGE"
          trap 'docker rm -f leetdesk-server-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --header "Authorization: Bearer $token" \
              http://127.0.0.1:18787/v1/health | grep -qx 'ok'; then
              break
            fi
            sleep 1
          done
          test "$(curl --silent --fail --header "Authorization: Bearer $token" \
            http://127.0.0.1:18787/v1/health)" = 'ok'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18787/v1/health)" = '401'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          echo "Published \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

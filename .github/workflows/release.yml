name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag to publish (for example v0.1.3); leave blank to build only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: leetdesk-windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: leetdesk-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: leetdesk-macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check release version
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable-${{ matrix.target }} --profile minimal

      - name: Install Go for Windows tests
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install gopls for Windows tests
        if: runner.os == 'Windows'
        shell: bash
        run: go install golang.org/x/tools/gopls@latest

      - name: Build
        shell: bash
        run: cargo +stable-${{ matrix.target }} build --release --locked --target ${{ matrix.target }}

      - name: Test Windows desktop
        if: runner.os == 'Windows'
        shell: bash
        run: cargo +stable-${{ matrix.target }} test --locked --bin leetdesk --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/leetdesk.exe package/leetdesk.exe
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath '${{ matrix.artifact }}.zip'

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos.sh target/${{ matrix.target }}/release/leetdesk '${{ matrix.artifact }}.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip)
          test "${#files[@]}" -eq 3
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "LeetDesk $RELEASE_TAG" --generate-notes --verify-tag
          fi
